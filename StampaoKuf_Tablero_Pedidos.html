<html lang="es">

<title>StampaoKuf · Tablero de Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141228;--s1:#1c1938;--s2:#221e45;--s3:#2b2760;
  --br:#3a3668;--br2:#4a4480;
  --navy:#2b2d7e;--mg:#e8195a;
  --tx:#f5f2ff;
  --tx2:#ccc8ee;
  --tx3:#a8a3d0;
  --mu:#a8a3d0;--mu2:#7e7aa8;
  --ok:#3ec87a;--wn:#ffaa00;--er:#ff4455;
  --r:8px;--rl:11px;
  --mono:'Space Mono',monospace;
  --body:'DM Sans',sans-serif
}
html,body{min-height:100%;font-family:var(--body);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:var(--body);font-size:14px}

/* HEADER */
.hdr{background:var(--navy);border-bottom:3px solid var(--mg);padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{height:40px;width:auto;display:block}
.hdr-sep{width:1px;height:28px;background:rgba(255,255,255,.2)}
.hdr-sub{font-family:var(--mono);font-size:11px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase}
.btn-new{display:flex;align-items:center;gap:7px;padding:9px 18px;background:var(--mg);color:#fff;border:none;border-radius:var(--r);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:opacity .15s;white-space:nowrap}
.btn-new:hover{opacity:.83}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 22px;background:var(--s1);border-bottom:1px solid var(--br)}
.sc{background:var(--s2);border:0.5px solid var(--br);border-radius:var(--r);padding:11px 15px}
.sc-lbl{font-family:var(--body);font-size:11px;font-weight:600;color:var(--mu2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.sc-val{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.sc-p .sc-val{color:#c4c0e8}.sc-c .sc-val{color:#5db3f5}
.sc-d .sc-val{color:var(--wn)}.sc-n .sc-val{color:var(--ok)}

/* BOARD */
.board-wrap{padding:16px 22px;min-height:calc(100vh - 165px)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}

/* COLUMN HEADERS */
.col-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);border:0.5px solid var(--br);margin-bottom:10px}
.col-hd.hp{background:rgba(170,168,208,.07);border-color:rgba(170,168,208,.22)}
.col-hd.hc{background:rgba(56,150,240,.07);border-color:rgba(56,150,240,.22)}
.col-hd.hd{background:rgba(255,170,0,.07);border-color:rgba(255,170,0,.22)}
.col-hd.hn{background:rgba(62,200,122,.07);border-color:rgba(62,200,122,.22)}
.col-hd i{font-size:15px}
.hp i,.hp .chl{color:#c4c0e8}.hc i,.hc .chl{color:#5db3f5}
.hd i,.hd .chl{color:var(--wn)}.hn i,.hn .chl{color:var(--ok)}
.chl{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chb{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.hp .chb{background:rgba(170,168,208,.14);color:#c4c0e8}
.hc .chb{background:rgba(56,150,240,.14);color:#5db3f5}
.hd .chb{background:rgba(255,170,0,.14);color:var(--wn)}
.hn .chb{background:rgba(62,200,122,.14);color:var(--ok)}

/* CARDS */
.col-body{display:flex;flex-direction:column;gap:9px;min-height:60px}
.card{background:var(--s2);border:0.5px solid var(--br);border-radius:var(--rl);padding:13px 14px;cursor:grab;transition:border-color .15s,background .12s,transform .1s;position:relative;overflow:hidden}
.card:hover{border-color:var(--br2);background:var(--s3);transform:translateY(-1px)}
.card:active{cursor:grabbing;opacity:.8}
.card-stripe{height:3px;position:absolute;top:0;left:0;right:0}
.cs-green{background:linear-gradient(90deg,var(--ok) 0%,transparent 65%)}
.cs-yellow{background:linear-gradient(90deg,var(--wn) 0%,transparent 65%)}
.cs-red{background:linear-gradient(90deg,var(--er) 0%,transparent 65%)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:5px;margin-bottom:6px}
.card-name{font-family:var(--body);font-size:14px;font-weight:700;color:var(--tx);line-height:1.35}
.card-client{font-size:13px;font-weight:500;color:var(--tx3);margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dg{background:var(--ok);box-shadow:0 0 7px rgba(62,200,122,.55)}
.dy{background:var(--wn);box-shadow:0 0 7px rgba(255,170,0,.55)}
.dr{background:var(--er);box-shadow:0 0 7px rgba(255,68,85,.55)}
.dn{background:var(--br2)}
.card-desc{font-size:13px;font-weight:400;color:var(--tx3);line-height:1.55;margin-bottom:9px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* STATUS PILLS */
.card-status-row{display:flex;align-items:center;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;border:0.5px solid var(--br);font-family:var(--body);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.02em;text-transform:uppercase;user-select:none;color:var(--mu2);background:none}
.spill:hover{border-color:var(--br2);color:var(--tx2)}
.spill i{font-size:12px}
.spill.active-p{border-color:rgba(196,192,232,.5);background:rgba(196,192,232,.12);color:#c4c0e8}
.spill.active-c{border-color:rgba(56,150,240,.5);background:rgba(56,150,240,.12);color:#5db3f5}
.spill.active-d{border-color:rgba(255,170,0,.5);background:rgba(255,170,0,.12);color:var(--wn)}
.spill.active-n{border-color:rgba(62,200,122,.5);background:rgba(62,200,122,.12);color:var(--ok)}

.card-foot{display:flex;align-items:center;justify-content:space-between;border-top:0.5px solid var(--br);padding-top:8px;margin-top:2px}
.cdate{font-family:var(--body);font-size:12px;font-weight:500;color:var(--mu2);display:flex;align-items:center;gap:5px}
.cdate i{font-size:13px}
.cdate.ov{color:var(--er)}.cdate.wn{color:var(--wn)}
.card-actions{display:flex;gap:2px}
.ibtn{background:none;border:none;cursor:pointer;padding:4px 6px;color:var(--mu2);font-size:16px;border-radius:5px;transition:all .12s;line-height:1}
.ibtn:hover{background:var(--br);color:var(--tx)}
.empty{font-size:13px;color:var(--mu2);text-align:center;padding:22px 10px;border:0.5px dashed var(--br);border-radius:var(--r);font-weight:500}
.drag-over .col-body{background:rgba(232,25,90,.04);border-radius:var(--r);outline:1.5px dashed rgba(232,25,90,.4);outline-offset:3px}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(8,6,24,.82);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal{background:var(--s1);border:0.5px solid var(--br2);border-top:2px solid var(--mg);border-radius:var(--rl);width:min(480px,96vw);padding:1.4rem;max-height:92vh;overflow-y:auto}
.m-title{font-family:var(--body);font-size:15px;font-weight:700;color:var(--tx);letter-spacing:.01em;margin-bottom:1.1rem;padding-bottom:.85rem;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:9px}
.m-title i{color:var(--mg);font-size:18px}
.del-bar{background:rgba(255,68,85,.08);border:0.5px solid rgba(255,68,85,.28);border-radius:var(--r);padding:10px 13px;font-size:13px;color:#ff8899;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.del-bar i{font-size:18px;color:var(--er);flex-shrink:0}
.btn-delconfirm{margin-left:auto;padding:6px 13px;background:var(--er);color:#fff;border:none;border-radius:var(--r);font-family:var(--body);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.frow{margin-bottom:14px}
.frow label{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--mu2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.frow input,.frow textarea{width:100%;font-size:14px;padding:9px 12px;border:0.5px solid var(--br2);border-radius:var(--r);background:var(--s2);color:var(--tx);transition:border-color .12s}
.frow input:focus,.frow textarea:focus{outline:none;border-color:var(--mg)}
.frow textarea{resize:vertical;min-height:76px;line-height:1.55}
.flabel-hint{color:var(--mu2);font-size:11px;letter-spacing:0;text-transform:none;margin-left:4px;font-weight:400}
.date-row{display:flex;align-items:center;gap:8px}
.date-row input{flex:1}
.date-toggle{display:flex;align-items:center;gap:5px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--mu2);cursor:pointer;white-space:nowrap;letter-spacing:.04em;padding:8px 12px;border:0.5px solid var(--br);border-radius:var(--r);transition:all .15s;user-select:none}
.date-toggle:hover{border-color:var(--br2);color:var(--tx2)}
.date-toggle.manual-on{border-color:var(--mg);color:var(--mg);background:rgba(232,25,90,.08)}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.aopt{display:flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--body);font-size:12px;font-weight:600;padding:7px 13px;border:0.5px solid var(--br);border-radius:var(--r);color:var(--mu);transition:all .12s;user-select:none}
.aopt:hover{border-color:var(--br2);color:var(--tx2)}
.aopt.ag{border-color:var(--ok);background:rgba(62,200,122,.1);color:var(--ok)}
.aopt.ay{border-color:var(--wn);background:rgba(255,170,0,.1);color:var(--wn)}
.aopt.ar{border-color:var(--er);background:rgba(255,68,85,.1);color:var(--er)}
.adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:1.1rem;padding-top:.85rem;border-top:1px solid var(--br);align-items:center}
.mfoot-left{margin-right:auto}
.btn-del{display:none;align-items:center;gap:6px;padding:8px 13px;background:none;border:0.5px solid rgba(255,68,85,.35);border-radius:var(--r);font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;color:var(--er);transition:all .12s}
.btn-del:hover{background:rgba(255,68,85,.1)}
.btn-cancel{padding:8px 16px;background:none;border:0.5px solid var(--br2);border-radius:var(--r);font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .12s}
.btn-cancel:hover{color:var(--tx2)}
.btn-save{display:flex;align-items:center;gap:6px;padding:9px 20px;background:var(--mg);color:#fff;border:none;border-radius:var(--r);font-family:var(--body);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.84}
</style>
</head>

<div class="stats">
  <div class="sc sc-p"><div class="sc-lbl">Pendiente</div><div class="sc-val" id="st-pending">0</div></div>
  <div class="sc sc-c"><div class="sc-lbl">Confirmado</div><div class="sc-val" id="st-confirm">0</div></div>
  <div class="sc sc-d"><div class="sc-lbl">En proceso</div><div class="sc-val" id="st-doing">0</div></div>
  <div class="sc sc-n"><div class="sc-lbl">Listo</div><div class="sc-val" id="st-done">0</div></div>
</div>

<div class="board-wrap">
  <div class="board">
    <div class="col" id="col-pending" ondragover="dragOver(event,'pending')" ondragleave="dragLeave(event)" ondrop="drop(event,'pending')">
      <div class="col-hd hp"><i class="ti ti-clock"></i><span class="chl">Pendiente</span><span class="chb" id="badge-pending">0</span></div>
      <div class="col-body" id="body-pending"></div>
    </div>
    <div class="col" id="col-confirm" ondragover="dragOver(event,'confirm')" ondragleave="dragLeave(event)" ondrop="drop(event,'confirm')">
      <div class="col-hd hc"><i class="ti ti-circle-check"></i><span class="chl">Confirmado</span><span class="chb" id="badge-confirm">0</span></div>
      <div class="col-body" id="body-confirm"></div>
    </div>
    <div class="col" id="col-doing" ondragover="dragOver(event,'doing')" ondragleave="dragLeave(event)" ondrop="drop(event,'doing')">
      <div class="col-hd hd"><i class="ti ti-flame"></i><span class="chl">En proceso</span><span class="chb" id="badge-doing">0</span></div>
      <div class="col-body" id="body-doing"></div>
    </div>
    <div class="col" id="col-done" ondragover="dragOver(event,'done')" ondragleave="dragLeave(event)" ondrop="drop(event,'done')">
      <div class="col-hd hn"><i class="ti ti-check"></i><span class="chl">Listo</span><span class="chb" id="badge-done">0</span></div>
      <div class="col-body" id="body-done"></div>
    </div>
  </div>
</div>

<div id="mbg" class="mbg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-title">
      <i class="ti ti-clipboard-list"></i>
      <span id="m-title-txt">Nuevo pedido</span>
    </div>
    <div id="del-bar" class="del-bar" style="display:none">
      <i class="ti ti-alert-triangle"></i>
      <span>¿Confirmar eliminación? No se puede deshacer.</span>
      <button class="btn-delconfirm" onclick="confirmDel()">Eliminar</button>
    </div>
    <div class="frow">
      <label>Nombre del pedido</label>
      <input type="text" id="f-name" placeholder="Ej: Poleras equipo Antártica x12" />
    </div>
    <div class="frow">
      <label>Cliente</label>
      <input type="text" id="f-client" placeholder="Nombre o empresa" />
    </div>
    <div class="frow">
      <label>Descripción / detalles</label>
      <textarea id="f-desc" placeholder="Técnica, colores, tallas, archivo, notas de producción..."></textarea>
    </div>
    <div class="frow">
      <label>Fecha límite <span class="flabel-hint" id="date-hint">— hoy por defecto</span></label>
      <div class="date-row">
        <input type="date" id="f-date" />
        <div class="date-toggle" id="date-toggle" onclick="toggleManualDate()">
          <i class="ti ti-pencil" id="date-toggle-icon"></i>
          <span id="date-toggle-txt">Cambiar</span>
        </div>
      </div>
    </div>
    <div class="frow">
      <label>Alerta <span class="flabel-hint">(automática por fecha si no se elige)</span></label>
      <div class="arow">
        <div class="aopt" id="aopt-green"  onclick="selAlert('green')"><div class="adot" style="background:var(--ok)"></div>Verde</div>
        <div class="aopt" id="aopt-yellow" onclick="selAlert('yellow')"><div class="adot" style="background:var(--wn)"></div>Amarillo</div>
        <div class="aopt" id="aopt-red"    onclick="selAlert('red')"><div class="adot" style="background:var(--er)"></div>Rojo</div>
      </div>
    </div>
    <div class="mfoot">
      <div class="mfoot-left">
        <button class="btn-del" id="btn-del" onclick="toggleDel()"><i class="ti ti-trash"></i> Eliminar</button>
      </div>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveOrder()"><i class="ti ti-device-floppy"></i> Guardar</button>
    </div>
  </div>
</div>

<script>
var orders = [];
try { orders = JSON.parse(localStorage.getItem('kuf_pedidos') || '[]'); } catch(e) {}
var editId = null, curAlert = '', dragId = null, manualDate = false;

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function persist() { try { localStorage.setItem('kuf_pedidos', JSON.stringify(orders)); } catch(e) {} }

function daysLeft(d) {
  if (!d) return null;
  var n = new Date(); n.setHours(0,0,0,0);
  return Math.ceil((new Date(d + 'T00:00:00') - n) / 86400000);
}

function autoAlert(d) {
  var n = daysLeft(d);
  if (n === null) return 'none';
  if (n < 0 || n <= 2) return 'red';
  if (n <= 5) return 'yellow';
  return 'green';
}

function effAlert(d, manual) { return (manual && manual !== '') ? manual : autoAlert(d); }

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '';
  var p = d.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function dateLabel(d) {
  if (!d) return '';
  var n = daysLeft(d), base = fmtDate(d);
  if (n === null) return base;
  if (n < 0)  return base + ' · vencido';
  if (n === 0) return base + ' · hoy';
  if (n === 1) return base + ' · mañana';
  return base + ' · ' + n + 'd';
}

var STATUS_META = {
  pending: { label:'Pendiente', icon:'ti-clock',        cls:'active-p' },
  confirm: { label:'Confirmado',icon:'ti-circle-check', cls:'active-c' },
  doing:   { label:'Proceso',   icon:'ti-flame',        cls:'active-d' },
  done:    { label:'Listo',     icon:'ti-check',        cls:'active-n' }
};

function statusPillsHTML(oid, currentStatus) {
  return Object.keys(STATUS_META).map(function(s) {
    var m = STATUS_META[s];
    var active = (s === currentStatus) ? ' ' + m.cls : '';
    return '<button class="spill' + active + '" onclick="changeStatus(event,\'' + oid + '\',\'' + s + '\')" title="' + m.label + '">'
      + '<i class="ti ' + m.icon + '"></i>' + m.label + '</button>';
  }).join('');
}

function changeStatus(e, oid, newStatus) {
  e.stopPropagation();
  var o = orders.find(function(x){ return x.id === oid; });
  if (o && o.status !== newStatus) { o.status = newStatus; persist(); render(); }
}

function render() {
  ['pending','confirm','doing','done'].forEach(function(s) {
    var list = orders.filter(function(o){ return o.status === s; });
    document.getElementById('badge-' + s).textContent = list.length;
    document.getElementById('st-' + s).textContent = list.length;
    var body = document.getElementById('body-' + s);
    if (!list.length) { body.innerHTML = '<div class="empty">— sin pedidos —</div>'; return; }
    body.innerHTML = list.map(function(o) {
      var al = effAlert(o.date, o.alert);
      var stripe = al !== 'none' ? '<div class="card-stripe cs-' + al + '"></div>' : '';
      var n = daysLeft(o.date);
      var dc = (n !== null && n < 0) ? 'cdate ov' : (n !== null && n <= 2) ? 'cdate wn' : 'cdate';
      var dotC = al==='none'?'dot dn':al==='green'?'dot dg':al==='yellow'?'dot dy':'dot dr';
      return '<div class="card" draggable="true" ondragstart="dStart(event,\'' + o.id + '\')" ondragend="dEnd(event)">'
        + stripe
        + '<div class="card-top">'
          + '<div>'
            + '<div class="card-name">' + esc(o.name) + '</div>'
            + (o.client ? '<div class="card-client">' + esc(o.client) + '</div>' : '')
          + '</div>'
          + '<div class="' + dotC + '" title="Alerta: ' + al + '"></div>'
        + '</div>'
        + (o.desc ? '<div class="card-desc">' + esc(o.desc) + '</div>' : '')
        + '<div class="card-status-row">' + statusPillsHTML(o.id, o.status) + '</div>'
        + '<div class="card-foot">'
          + '<div class="' + dc + '">' + (o.date ? '<i class="ti ti-calendar"></i>' + dateLabel(o.date) : '') + '</div>'
          + '<div class="card-actions">'
            + '<button class="ibtn" title="Editar pedido" onclick="editOrder(\'' + o.id + '\')"><i class="ti ti-edit"></i></button>'
          + '</div>'
        + '</div>'
      + '</div>';
    }).join('');
  });
}

function toggleManualDate() {
  manualDate = !manualDate;
  var input = document.getElementById('f-date');
  var toggle = document.getElementById('date-toggle');
  var hint = document.getElementById('date-hint');
  var icon = document.getElementById('date-toggle-icon');
  var txt = document.getElementById('date-toggle-txt');
  if (manualDate) {
    input.removeAttribute('disabled');
    input.style.opacity = '1';
    toggle.classList.add('manual-on');
    icon.className = 'ti ti-lock';
    txt.textContent = 'Auto';
    hint.textContent = '— editable';
  } else {
    input.value = todayStr();
    input.setAttribute('disabled','disabled');
    input.style.opacity = '.5';
    toggle.classList.remove('manual-on');
    icon.className = 'ti ti-pencil';
    txt.textContent = 'Cambiar';
    hint.textContent = '— hoy por defecto';
  }
}

function openModal(id) {
  editId = id || null;
  var o = id ? orders.find(function(x){ return x.id === id; }) : null;
  document.getElementById('m-title-txt').textContent = id ? 'Editar pedido' : 'Nuevo pedido';
  document.getElementById('f-name').value   = o ? o.name   : '';
  document.getElementById('f-client').value = o ? o.client : '';
  document.getElementById('f-desc').value   = o ? o.desc   : '';
  curAlert = o ? o.alert : '';

  manualDate = false;
  var input  = document.getElementById('f-date');
  var toggle = document.getElementById('date-toggle');
  var hint   = document.getElementById('date-hint');
  var icon   = document.getElementById('date-toggle-icon');
  var txt    = document.getElementById('date-toggle-txt');

  if (id && o.date) {
    input.value = o.date;
    manualDate = true;
    input.removeAttribute('disabled');
    input.style.opacity = '1';
    toggle.classList.add('manual-on');
    icon.className = 'ti ti-lock';
    txt.textContent = 'Auto';
    hint.textContent = '— editable';
  } else {
    input.value = todayStr();
    input.setAttribute('disabled','disabled');
    input.style.opacity = '.5';
    toggle.classList.remove('manual-on');
    icon.className = 'ti ti-pencil';
    txt.textContent = 'Cambiar';
    hint.textContent = '— hoy por defecto';
  }

  updateAlertUI();
  document.getElementById('del-bar').style.display = 'none';
  document.getElementById('btn-del').style.display = id ? 'flex' : 'none';
  document.getElementById('mbg').style.display = 'flex';
  setTimeout(function(){ document.getElementById('f-name').focus(); }, 60);
}

function closeModal() { document.getElementById('mbg').style.display = 'none'; editId = null; }

function selAlert(v) { curAlert = curAlert === v ? '' : v; updateAlertUI(); }
function updateAlertUI() {
  document.getElementById('aopt-green').className  = 'aopt' + (curAlert === 'green'  ? ' ag' : '');
  document.getElementById('aopt-yellow').className = 'aopt' + (curAlert === 'yellow' ? ' ay' : '');
  document.getElementById('aopt-red').className    = 'aopt' + (curAlert === 'red'    ? ' ar' : '');
}

function saveOrder() {
  var name = document.getElementById('f-name').value.trim();
  if (!name) {
    var el = document.getElementById('f-name');
    el.style.borderColor = 'var(--er)'; el.focus();
    setTimeout(function(){ el.style.borderColor = ''; }, 1800);
    return;
  }
  var existingStatus = editId ? orders.find(function(x){ return x.id === editId; }).status : 'pending';
  var o = {
    id:     editId || Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    name:   name,
    client: document.getElementById('f-client').value.trim(),
    desc:   document.getElementById('f-desc').value.trim(),
    date:   document.getElementById('f-date').value,
    alert:  curAlert,
    status: existingStatus
  };
  if (editId) {
    var i = orders.findIndex(function(x){ return x.id === editId; });
    if (i > -1) orders[i] = o;
  } else {
    orders.unshift(o);
  }
  persist(); render(); closeModal();
}

function editOrder(id) { openModal(id); }

function toggleDel() {
  var b = document.getElementById('del-bar');
  b.style.display = b.style.display === 'none' ? 'flex' : 'none';
}
function confirmDel() {
  orders = orders.filter(function(o){ return o.id !== editId; });
  persist(); render(); closeModal();
}

function dStart(e, id) {
  dragId = id; e.dataTransfer.effectAllowed = 'move';
  setTimeout(function(){
    var el = document.querySelector('[ondragstart*="' + id + '"]');
    if (el) el.style.opacity = '.4';
  }, 0);
}
function dEnd(e) { e.currentTarget.style.opacity = '1'; dragId = null; }
function dragOver(e, col) { e.preventDefault(); document.getElementById('col-' + col).classList.add('drag-over'); }
function dragLeave(e) { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); }
function drop(e, col) {
  e.preventDefault();
  document.getElementById('col-' + col).classList.remove('drag-over');
  if (!dragId) return;
  var o = orders.find(function(x){ return x.id === dragId; });
  if (o && o.status !== col) { o.status = col; persist(); render(); }
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
